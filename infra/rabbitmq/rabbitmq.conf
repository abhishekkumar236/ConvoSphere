# =====================================================================================
# RabbitMQ settings for vmeet. Mounted read-only at /etc/rabbitmq/rabbitmq.conf.
#
# FORMAT RULE: a comment must be on its own line. "key = value  # comment" does NOT work:
# everything after "=" becomes the value.
# =====================================================================================


# -------------------------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------------------------

# Write logs to the container's output so `docker logs rabbitmq` (and any log collector
# reading Docker output) sees them. No log files growing inside the container.
log.console = true
log.console.level = info
log.file = false


# -------------------------------------------------------------------------------------
# Resource limits: refuse new messages instead of crashing
# -------------------------------------------------------------------------------------

# When RabbitMQ uses more than 600 MB of memory it stops reading from publishers
# (a "memory alarm") until consumers catch up. Without this, Docker would kill the
# container at its 1 GB limit (mem_limit in the compose file) and every connection drops.
# Keep this at about 60% of the container limit; change both together.
vm_memory_high_watermark.absolute = 800MB

# Same idea for disk: block publishers when less than 1 GB is free, so the disk never
# fills up completely (a full disk can corrupt stored messages).
disk_free_limit.absolute = 1GB


# -------------------------------------------------------------------------------------
# MQTT (apps connect with MQTT)
# -------------------------------------------------------------------------------------

# MQTT over plain TCP. Used for testing tools (Postman, mosquitto clients) and services.
mqtt.listeners.tcp.default = 1883

# Every MQTT client must log in. No anonymous connections.
mqtt.allow_anonymous = false

# MQTT clients work inside the default virtual host "/".
mqtt.vhost = /

# MQTT topics become routing keys on this exchange: MQTT "in/7/chat" = routing key "in.7.chat".
# Services can also read/write the same messages over AMQP through this exchange.
mqtt.exchange = amq.topic

# A device that is offline keeps its queued messages (persistent session) for at most
# 1 day. After that the session is deleted and the app catches up through the API instead.
# This stops abandoned devices from filling memory and disk with queues nobody reads.
mqtt.max_session_expiry_interval_seconds = 86400


# -------------------------------------------------------------------------------------
# MQTT over WebSocket (browsers and mobile apps)
# -------------------------------------------------------------------------------------

# Apps connect to ws://<host>:15675/ws. In production a proxy (nginx / load balancer)
# in front adds TLS, so apps use wss://, while RabbitMQ itself stays plain inside the network.
web_mqtt.tcp.port = 15675
web_mqtt.ws_path = /ws


# -------------------------------------------------------------------------------------
# Authentication: who may log in, and what they may do
# -------------------------------------------------------------------------------------

# Backends are tried in this order for every login:
#   1. internal = RabbitMQ's own user (the admin from infra/.env). Our services log in
#      with it, so they never depend on the api being up.
#   2. cache    = everything else (apps). The cache asks the HTTP backend below and
#      remembers the answer.
# The backend that accepts a login also decides that connection's permissions.
auth_backends.1 = internal
auth_backends.2 = cache

# The backend the cache sits in front of: the HTTP backend (our api answers).
auth_cache.cached_backend = http

# Remember each answer for 60 s (in milliseconds). Without the cache, every subscribe and
# publish would be an HTTP call to the api. A revoked token stays usable for at most 60 s.
auth_cache.cache_ttl = 60000

# RabbitMQ sends the check as an HTTP POST with form fields
# (application/x-www-form-urlencoded), not JSON.
auth_http.http_method = post

# Give up on the api after 2 s (in milliseconds; default 15 s). One login makes several
# calls, so with the default a stuck api would leave apps waiting for minutes.
auth_http.connection_timeout = 2000
auth_http.request_timeout = 2000

# The api endpoints that answer "allow" or "deny". "api" is the api container's name on
# the vmeet Docker network and 9090 its port: the api service must use that name.
#   user     = can this username + password (the app's access token) log in?
auth_http.user_path = http://api:9090/api/v1/auth/mqtt/user
#   vhost    = may this user use virtual host "/"?
auth_http.vhost_path = http://api:9090/api/v1/auth/mqtt/vhost
#   resource = may this user create/read/write this queue or exchange?
auth_http.resource_path = http://api:9090/api/v1/auth/mqtt/resource
#   topic    = may this user publish to / subscribe to this topic?
auth_http.topic_path = http://api:9090/api/v1/auth/mqtt/topic
